{% extends 'base.html' %}
{% block title %}Список акций{% endblock %}
{% block content %}
<h1>Акции</h1>
<a href="{% url 'promotion_create' %}">Добавить акцию</a>
<ul>
    {% for promotion in promotions %}
    <li>
        <a href="{% url 'promotion_detail' promotion.pk %}">{{ promotion.title }}</a>
        <a href="{% url 'promotion_update' promotion.pk %}">Редактировать</a>
        <a href="{% url 'promotion_delete' promotion.pk %}">Удалить</a>
    </li>
    {% empty %}
    <li>Акций пока нет.</li>
    {% endfor %}
</ul>
<a href="{% url 'home' %}">Вернуться на главную</a>
{% endblock %}
