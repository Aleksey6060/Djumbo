{% extends 'base.html' %}
{% block title %}Удалить магазин{% endblock %}
{% block content %}
<h1>Удалить магазин "{{ shop.name }}"</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
</form>
<a href="{% url 'shop_list' %}">Вернуться к списку магазинов</a>
{% endblock %}
