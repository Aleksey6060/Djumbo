{% extends 'base.html' %}
{% block title %}Удалить сотрудника{% endblock %}
{% block content %}
<h1>Удалить сотрудника "{{ employee.name }}"</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
</form>
<a href="{% url 'employee_list' %}">Вернуться к списку сотрудников</a>
{% endblock %}
