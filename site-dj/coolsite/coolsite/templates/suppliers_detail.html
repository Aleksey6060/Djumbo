{% extends 'base.html' %}
{% block title %}{{ supplier.name }}{% endblock %}
{% block content %}
<h1>{{ supplier.name }}</h1>
<p>Email: {{ supplier.contact_email }}</p>
<p>Телефон: {{ supplier.phone }}</p>
<p>Адрес: {{ supplier.address }}</p>
<a href="{% url 'supplier_list' %}">Вернуться к списку поставщиков</a>
<a href="{% url 'supplier_update' supplier.pk %}">Редактировать</a>
<a href="{% url 'supplier_delete' supplier.pk %}">Удалить</a>
{% endblock %}
