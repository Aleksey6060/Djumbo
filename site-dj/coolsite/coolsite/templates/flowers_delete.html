{% extends 'base.html' %}
{% block title %}Удалить цветок{% endblock %}
{% block content %}
<h1>Удалить цветок "{{ flower.name }}"</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
</form>
<a href="{% url 'flower_list' %}">Вернуться к списку цветов</a>
{% endblock %}
