<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все товары</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
        }
        nav {
            background-color: #444;
            overflow: hidden;
        }
        nav .container {
            position: relative;
        }
        nav a {
            display: inline-block;
            color: #fff;
            text-align: center;
            padding: 1rem 2rem;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color: #555;
        }
        .dropdown {
            display: inline-block;
            position: relative;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #444;
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .dropdown-content a {
            display: block;
            padding: 1rem;
            text-align: left;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        main {
            padding: 2rem;
        }
        section {
            margin-bottom: 2rem;
            padding: 2rem;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        section h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 0.5rem;
            color: #333;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        footer p {
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Все товары</h1>
        </div>
    </header>
     <nav>
        <div class="container">
            <a href="{% url 'home' %}">Главная</a>
            <a href="{% url 'about' %}">О компании</a>

                <a href="{% url 'contact' %}">Контакты</a>
                <a href="{% url 'how_to_find' %}">Как нас найти</a>

            <a href="{% url 'categories' %}">Товары</a>

                <a href="{% url 'categories' %}">Категории</a>
                <a href="{% url 'all_products' %}">Все товары</a>

            <a href="{% url 'cart' %}">Корзина</a>
        </div>
    </nav>
    <main>
        <div class="container">
            <section>
                <h2>Все товары</h2>
                <p>Просмотрите полный список наших товаров.</p>
            </section>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 Мой Сайт. Все права защищены.</p>
        </div>
    </footer>
